name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hook:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh -n hooks/tabstatus.sh && sh -n tests/tabstatus.test.sh
      - if: runner.os == 'Linux'
        run: shellcheck -S warning hooks/tabstatus.sh tests/tabstatus.test.sh
      - run: ./tests/tabstatus.test.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
